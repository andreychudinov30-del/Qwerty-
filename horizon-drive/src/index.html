<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07080b">
<title>HORIZON DRIVE</title>
<style>
:root{--pink:#ff2a6d;--orange:#ff7b00;--gold:#ffc400;--cyan:#2ad4ff;--bg:rgba(10,12,18,.82);--glass:rgba(16,18,26,.72);--txt:#f4f6fa;--mut:#9aa3b5;--btn:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#07080b;color:var(--txt);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
.it{font-style:italic;font-weight:900;letter-spacing:.02em;text-transform:uppercase}
#loading{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#1b1020 0,#07080b 70%)}
#loading h1{font-size:clamp(38px,8vw,96px);margin:0;font-style:italic;font-weight:900;background:linear-gradient(90deg,var(--pink),var(--orange),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;transform:skewX(-8deg)}
#loading .sub{color:var(--mut);letter-spacing:.4em;font-size:12px;margin-bottom:28px}
.bar{width:min(520px,70vw);height:6px;background:#1d212b;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--gold));transition:width .2s}
#loadTxt{margin-top:12px;color:var(--mut);font-size:13px}
#tip{position:absolute;bottom:6vh;color:#c7cbd6;font-size:13px;max-width:80vw;text-align:center}
/* menu */
#menu{position:fixed;inset:0;z-index:10;pointer-events:none}
#menu .logo{position:absolute;left:4vw;top:5vh;font-size:clamp(28px,4.6vw,64px);transform:skewX(-10deg);background:linear-gradient(90deg,var(--pink),var(--orange),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(255,42,109,.35))}
#menu .logo small{display:block;font-size:.22em;color:#fff;letter-spacing:.6em;-webkit-text-fill-color:#dfe3ea;margin-top:-4px}
#mbtns{position:absolute;left:4vw;top:22vh;bottom:4vh;overflow-y:auto;overflow-x:hidden;padding-right:14px;display:flex;flex-direction:column;gap:1.1vh;pointer-events:auto;touch-action:pan-y}
.mbtn{width:clamp(210px,25vw,340px);padding:clamp(9px,1.6vh,16px) 22px;background:linear-gradient(100deg,rgba(255,255,255,.1),rgba(255,255,255,.02));border:none;border-left:4px solid transparent;color:#fff;text-align:left;font-size:clamp(14px,1.9vh,20px);transform:skewX(-10deg);cursor:pointer;transition:all .18s;backdrop-filter:blur(6px);opacity:0;animation:slideIn .5s forwards}
.mbtn span{display:inline-block;transform:skewX(10deg)}
.mbtn:hover,.mbtn:focus,.mbtn.sel{background:linear-gradient(100deg,var(--pink),var(--orange));border-left-color:var(--gold);transform:skewX(-10deg) translateX(10px);outline:none}
@keyframes slideIn{from{opacity:0;transform:skewX(-10deg) translateX(-40px)}to{opacity:1;transform:skewX(-10deg)}}
#coins{position:fixed;right:3vw;top:3vh;z-index:20;padding:8px 18px;background:var(--glass);border-radius:4px;font-size:18px;transform:skewX(-10deg);backdrop-filter:blur(8px);border-bottom:2px solid var(--gold)}
#coins b{color:var(--gold)}
#carTag{position:absolute;right:4vw;bottom:6vh;text-align:right}
#carTag .nm{font-size:clamp(22px,3.2vw,44px);transform:skewX(-8deg)}#carTag .cl{color:var(--mut);letter-spacing:.3em;font-size:12px}
.pi{display:inline-block;padding:2px 8px;margin-left:8px;font-size:.5em;vertical-align:middle;border-radius:3px;background:var(--pink)}
/* panels */
#panel{position:fixed;z-index:15;top:0;bottom:0;right:0;width:min(440px,46vw);background:linear-gradient(90deg,rgba(8,9,13,0),rgba(8,9,13,.88) 12%);padding:68px 22px 16px 46px;overflow-y:auto;overflow-x:hidden;touch-action:pan-y}
#panel h2{margin:0 0 10px;font-size:28px;transform:skewX(-8deg)}
#back{position:fixed;left:3vw;top:3vh;z-index:21;pointer-events:auto}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}.tab{padding:6px 10px;font-size:12px;background:rgba(255,255,255,.07);border:none;color:#ccd;cursor:pointer;transform:skewX(-8deg)}.tab.on{background:var(--pink);color:#fff}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:rgba(255,255,255,.06);border-left:3px solid transparent;cursor:pointer;font-size:14px;transition:background .15s}
.item:hover{background:rgba(255,255,255,.12)}.item.on{border-left-color:var(--pink);background:rgba(255,42,109,.16)}.item .pr{color:var(--gold);font-weight:700;white-space:nowrap}.item .own{color:#6fe39a;font-size:12px}.item .lock{color:#ff6b6b;font-size:12px}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}.sw i{height:34px;border-radius:3px;cursor:pointer;border:2px solid rgba(255,255,255,.15)}.sw i.on{border-color:#fff;box-shadow:0 0 0 2px var(--pink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;font-size:14px}.row label{color:#cfd5e2}
input[type=range]{width:55%;accent-color:var(--pink)}select{background:#151821;color:#fff;border:1px solid #333a48;padding:6px;border-radius:3px;max-width:55%}
.btn{padding:11px 18px;background:linear-gradient(100deg,var(--pink),var(--orange));color:#fff;border:none;font-weight:900;font-style:italic;text-transform:uppercase;cursor:pointer;transform:skewX(-8deg);font-size:15px}
.btn.g{background:rgba(255,255,255,.12)}.btn:disabled{opacity:.4}
.stats{margin:8px 0 12px}.st{display:grid;grid-template-columns:110px 1fr 46px;align-items:center;gap:8px;font-size:12px;color:#cfd5e2;margin:4px 0}.st .b{height:6px;background:#22262f}.st .b i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),#8ef)}
.st .b i.up{background:linear-gradient(90deg,var(--cyan),#6fe39a)}
.sec{margin:14px 0 6px;color:var(--mut);font-size:11px;letter-spacing:.25em;text-transform:uppercase}
.card{padding:12px;background:rgba(255,255,255,.06);margin-bottom:8px;cursor:pointer;border-left:3px solid transparent}.card.on{border-left-color:var(--pink);background:rgba(255,42,109,.14)}.card b{font-size:18px;font-style:italic}.card p{margin:4px 0 0;color:var(--mut);font-size:12px}
#buyBar{position:sticky;bottom:0;padding:10px 0;background:linear-gradient(0deg,rgba(8,9,13,.95),rgba(8,9,13,0))}
/* HUD */
#hud{position:fixed;inset:0;z-index:12;pointer-events:none}
#hudTL{position:absolute;left:max(2vw,env(safe-area-inset-left));top:2vh;display:flex;gap:18px;align-items:flex-start}
.hbox{background:var(--glass);padding:6px 14px;transform:skewX(-10deg);backdrop-filter:blur(6px);border-bottom:2px solid var(--pink)}.hbox>*{transform:skewX(10deg)}
.hbox .l{font-size:10px;color:var(--mut);letter-spacing:.2em}.hbox .v{font-size:clamp(18px,3vh,30px);font-weight:900;font-style:italic}
#pos .v{font-size:clamp(28px,5vh,48px)}#pos .v small{font-size:.45em}
#mini{position:absolute;right:max(2vw,env(safe-area-inset-right));top:2vh;width:clamp(120px,22vh,210px);height:clamp(120px,22vh,210px);border-radius:50%;background:rgba(8,10,14,.55);border:2px solid rgba(255,255,255,.18)}
#speedo{position:absolute;right:max(2vw,env(safe-area-inset-right));bottom:2vh;width:clamp(170px,30vh,270px);height:clamp(170px,30vh,270px)}
#msg{position:absolute;left:0;right:0;top:30vh;text-align:center;font-size:clamp(40px,10vh,120px);font-style:italic;font-weight:900;text-shadow:0 6px 30px rgba(0,0,0,.6);transform:skewX(-8deg)}
#sub{position:absolute;left:0;right:0;top:46vh;text-align:center;font-size:clamp(14px,2.6vh,24px);font-style:italic;font-weight:800;color:var(--gold);text-shadow:0 3px 14px rgba(0,0,0,.8)}
#drift{position:absolute;left:50%;top:14vh;transform:translateX(-50%) skewX(-10deg);text-align:center;font-weight:900;font-style:italic;color:#fff;text-shadow:0 0 16px var(--pink)}#drift .p{font-size:clamp(22px,4vh,40px)}#drift .t{font-size:12px;letter-spacing:.3em;color:var(--gold)}
#assist{position:absolute;right:calc(max(2vw,env(safe-area-inset-right)) + clamp(175px,31vh,280px));bottom:3vh;display:flex;flex-direction:column;gap:4px}
#assist i{font-style:normal;font-size:11px;padding:2px 6px;border:1px solid #556;color:#556;font-weight:800}#assist i.on{color:#ffcc00;border-color:#ffcc00}
#fps{position:fixed;left:50%;top:4px;z-index:40;font:12px monospace;color:#7f7;transform:translateX(-50%)}
#dmg{position:absolute;left:max(2vw,env(safe-area-inset-left));top:calc(2vh + 64px);font-size:11px;color:var(--mut)}
#dmg i{display:inline-block;width:80px;height:5px;background:#333;vertical-align:middle;margin-left:6px}#dmg i b{display:block;height:100%;background:#f55;width:0}
/* touch */
#touch{position:fixed;inset:0;z-index:13;pointer-events:none}
.tb{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(20,22,30,.45);border:2px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:calc(18px*var(--btn));backdrop-filter:blur(4px);touch-action:none}
.tb.on{background:rgba(255,42,109,.6);border-color:#fff}
.tb.pedal{border-radius:14px}
#tPause{width:44px;height:44px;left:50%;top:10px;transform:translateX(-50%);border-radius:8px;font-size:18px}
/* overlays */
.ov{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(5,6,9,.66);backdrop-filter:blur(6px)}
.ovb{background:linear-gradient(160deg,rgba(26,28,38,.96),rgba(12,13,18,.96));padding:26px 30px;min-width:min(520px,90vw);max-height:90vh;overflow:auto;border-top:3px solid var(--pink)}
.ovb h2{margin:0 0 12px;font-size:32px;font-style:italic;transform:skewX(-8deg)}
table.res{width:100%;border-collapse:collapse;font-size:14px}table.res td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.07)}table.res tr.me{background:rgba(255,42,109,.2)}
#toast{position:fixed;left:50%;bottom:12vh;transform:translateX(-50%);z-index:60;background:rgba(10,12,18,.9);padding:10px 18px;border-left:3px solid var(--gold);font-size:14px;transition:opacity .3s;opacity:0;pointer-events:none}
#rotate{position:fixed;inset:0;z-index:100;background:#07080b;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}
@media (orientation:portrait) and (max-width:900px){#rotate.need{display:flex}}
@media (max-height:500px){#panel{padding-top:56px}.mbtn{padding:7px 18px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="loading"><h1>HORIZON DRIVE</h1><div class="sub">ULTRA REALISTIC OPEN ROAD RACING</div><div class="bar"><i id="loadBar"></i></div><div id="loadTxt">Загрузка…</div><div id="tip"></div></div>
<div id="menu" class="hidden"><div class="logo it">HORIZON DRIVE<small>FESTIVAL EDITION</small></div><div id="mbtns"></div><div id="carTag"><div class="cl"></div><div class="nm it"></div></div></div>
<div id="coins" class="hidden">₵ <b>0</b></div>
<button id="back" class="btn g hidden">◀ Назад</button>
<div id="panel" class="hidden"></div>
<div id="hud" class="hidden">
  <div id="hudTL"><div class="hbox" id="pos"><div class="l">ПОЗИЦИЯ</div><div class="v">1<small>/8</small></div></div><div class="hbox" id="lap"><div class="l">КРУГ</div><div class="v">1/3</div></div><div class="hbox" id="time"><div class="l">ВРЕМЯ</div><div class="v">0:00.00</div></div><div class="hbox" id="best"><div class="l">ЛУЧШИЙ</div><div class="v">--</div></div></div>
  <div id="dmg">ПОВРЕЖДЕНИЯ<i><b></b></i></div>
  <canvas id="mini" width="420" height="420"></canvas><canvas id="speedo" width="540" height="540"></canvas>
  <div id="assist"><i id="aABS">ABS</i><i id="aTCS">TCS</i><i id="aESP">ESP</i></div>
  <div id="drift" class="hidden"><div class="p">0</div><div class="t">ДРИФТ</div></div>
  <div id="msg"></div><div id="sub"></div>
</div>
<div id="touch" class="hidden"></div>
<div id="fps" class="hidden"></div>
<div id="ov" class="ov hidden"><div class="ovb" id="ovb"></div></div>
<div id="toast"></div>
<div id="rotate"><div style="font-size:64px">⟳</div><h2 class="it">Поверните устройство</h2><p style="color:#9aa3b5">HORIZON DRIVE работает в горизонтальной ориентации</p></div>
<!--ASSETS-->
<!--APP-->
</body>
</html>
