<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#000000" />
<title>Обратная сторона города</title>
<style>
:root{--acc:#f2b632;--acc2:#3fd0ff;--bg:rgba(8,10,14,.82);--txt:#f4f1ea;--red:#ff3a3a;--grn:#4ddc6a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--txt);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
.font-title{font-family:Impact,"Arial Black","Franklin Gothic Heavy",sans-serif;letter-spacing:.02em;text-transform:uppercase}
#loading{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 60%,#1c2230 0%,#05060a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100}
#loading h1{font-size:min(8vw,72px);margin:0;color:#fff;text-shadow:0 0 30px rgba(242,182,50,.35)}
#loading h1 span{color:var(--acc)}
#loading .bar{width:min(70vw,520px);height:6px;background:#222;border-radius:3px;margin-top:28px;overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#ff7a2a);transition:width .2s}
#loading p{opacity:.7;margin-top:14px;font-size:14px;max-width:80vw;text-align:center}
#rotate{position:fixed;inset:0;background:#000;z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;font-size:20px;text-align:center;padding:20px}
@media (orientation:portrait) and (max-width:900px){#rotate.need{display:flex}}
/* menu */
#menu{position:fixed;inset:0;z-index:50;display:flex;align-items:center;background:linear-gradient(90deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.35) 45%,rgba(0,0,0,0) 70%)}
#menu .col{margin-left:6vw;display:flex;flex-direction:column;gap:10px;max-width:440px}
#menu h1{font-size:min(7.5vw,84px);line-height:.9;margin:0 0 6px;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.6)}
#menu h1 em{font-style:normal;color:var(--acc);display:block}
#menu .sub{opacity:.8;margin-bottom:18px;font-size:15px}
.btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff;padding:13px 22px;font-size:17px;text-align:left;cursor:pointer;border-radius:4px;transition:all .15s;font-weight:600;letter-spacing:.03em;backdrop-filter:blur(6px)}
.btn:hover,.btn:active{background:var(--acc);color:#111;border-color:var(--acc);transform:translateX(6px)}
.btn.small{padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.35;pointer-events:none}
.panel{position:fixed;z-index:60;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92vw,760px);max-height:88vh;overflow:auto;background:var(--bg);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:22px 26px;backdrop-filter:blur(12px);touch-action:pan-y}
.panel *{touch-action:pan-y}
.panel h2{margin:0 0 14px;color:var(--acc)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.row label{opacity:.9}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{background:#222;border:1px solid #444;color:#ddd;padding:6px 12px;border-radius:3px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--acc);color:#111;border-color:var(--acc)}
input[type=range]{width:180px;accent-color:var(--acc);touch-action:pan-x}
.close{position:absolute;right:14px;top:12px;background:none;border:none;color:#fff;font-size:26px;cursor:pointer}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:20}
#mmWrap{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:18px;width:min(23vw,230px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid rgba(0,0,0,.6);box-shadow:0 4px 20px rgba(0,0,0,.5)}
#mm{width:100%;height:100%}
#bars{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:calc(18px + min(23vw,230px) + 8px);width:min(23vw,230px);display:flex;gap:4px}
#bars div{flex:1;height:7px;background:rgba(0,0,0,.6);border-radius:2px;overflow:hidden}
#bars i{display:block;height:100%;width:100%}
#hpB{background:#4ddc6a}#arB{background:#3f9cff}
#topR{position:absolute;right:max(20px,env(safe-area-inset-right));top:16px;text-align:right}
#money{font-size:32px;color:#7ef09a;text-shadow:0 2px 6px #000,0 0 2px #000;font-weight:800}
#wanted{font-size:30px;letter-spacing:2px;height:36px}
#wanted b{color:rgba(255,255,255,.18);text-shadow:0 1px 3px #000}
#wanted b.on{color:#fff}
#wanted.flash b.on{animation:fl .5s infinite}
@keyframes fl{50%{opacity:.25}}
#weap{font-size:15px;opacity:.95;text-shadow:0 1px 3px #000;margin-top:2px}
#clock{font-size:14px;opacity:.85;text-shadow:0 1px 3px #000}
#objective{position:absolute;left:50%;bottom:9vh;transform:translateX(-50%);font-size:clamp(14px,2vw,20px);text-shadow:0 2px 4px #000,0 0 3px #000;text-align:center;max-width:70vw}
#objective b{color:var(--acc)}
#subtitle{position:absolute;left:50%;bottom:16vh;transform:translateX(-50%);font-size:clamp(15px,2.2vw,22px);text-align:center;max-width:76vw;text-shadow:0 2px 4px #000,0 0 3px #000;background:rgba(0,0,0,.35);padding:6px 14px;border-radius:4px}
#subtitle .who{color:var(--acc);font-weight:700}
#notify{position:absolute;left:max(18px,env(safe-area-inset-left));top:16px;display:flex;flex-direction:column;gap:6px;max-width:min(380px,40vw)}
#notify div{background:rgba(0,0,0,.72);padding:10px 14px;border-left:3px solid var(--acc);font-size:14px;border-radius:2px;animation:nin .3s}
@keyframes nin{from{opacity:0;transform:translateX(-20px)}}
#speedo{position:absolute;right:max(24px,env(safe-area-inset-right));bottom:20px;text-align:right;text-shadow:0 2px 6px #000}
#speedo .v{font-size:46px;font-weight:800;line-height:1}#speedo .u{font-size:13px;opacity:.7}
#speedo .hp{width:140px;height:5px;background:rgba(0,0,0,.6);margin-top:6px;margin-left:auto}#speedo .hp i{display:block;height:100%;background:#f2b632}
#cross{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%)}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross:before{left:12px;top:3px;width:2px;height:20px}#cross:after{top:12px;left:3px;height:2px;width:20px}
#cross.hit:before,#cross.hit:after{background:var(--red)}
#prompt{position:absolute;left:50%;top:62%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:8px 16px;border-radius:4px;font-size:15px}
#prompt kbd{background:var(--acc);color:#000;padding:1px 7px;border-radius:3px;font-weight:800;margin-right:6px}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none}
#banner .t{font-size:clamp(34px,7vw,82px);color:var(--acc);text-shadow:0 4px 20px rgba(0,0,0,.8),0 0 4px #000}
#banner .s{font-size:clamp(16px,2.4vw,26px);margin-top:6px;text-shadow:0 2px 6px #000}
#banner.red .t{color:#e8322a}
#letter{position:fixed;inset:0;pointer-events:none;z-index:15}
#letter:before,#letter:after{content:"";position:absolute;left:0;right:0;height:0;background:#000;transition:height .6s}
#letter:before{top:0}#letter:after{bottom:0}
#letter.on:before,#letter.on:after{height:11vh}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:40;transition:opacity .5s}
#skip{position:fixed;right:20px;bottom:calc(11vh + 12px);z-index:41;pointer-events:auto}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:14}
.bub{position:absolute;transform:translate(-50%,-100%);background:rgba(255,255,255,.92);color:#111;padding:5px 10px;border-radius:12px;font-size:13px;max-width:220px;text-align:center;white-space:normal}
.bub:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:rgba(255,255,255,.92);border-bottom:0}
.bub.angry{background:#ffdcdc}
#mapScreen{position:fixed;inset:0;z-index:45;background:#0a0d12}
#mapC{width:100%;height:100%}
#mapUI{position:absolute;left:16px;top:16px;background:rgba(0,0,0,.6);padding:12px 16px;border-radius:6px;font-size:13px;line-height:1.7;pointer-events:none}
#mapClose{position:absolute;right:16px;top:16px}
#shop .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
#shop .it{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);padding:12px;border-radius:6px;cursor:pointer}
#shop .it:hover{border-color:var(--acc)}
#shop .it b{display:block;font-size:15px}#shop .it span{color:#7ef09a;font-weight:700}#shop .it small{opacity:.7;display:block;margin-top:4px}
#shop .it.own{opacity:.55}
#choice{position:fixed;left:50%;bottom:14vh;transform:translateX(-50%);z-index:42;display:flex;flex-direction:column;gap:8px;width:min(90vw,560px)}
#choice .q{background:rgba(0,0,0,.8);padding:14px 18px;border-radius:6px;font-size:18px;border-left:4px solid var(--acc)}
/* touch */
#touch{position:fixed;inset:0;z-index:25;pointer-events:none}
.tbtn{position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(20,22,26,.55);border:2px solid rgba(255,255,255,.35);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:auto;line-height:1.05}
.tbtn.on{background:rgba(242,182,50,.75);color:#000}
#stick{position:absolute;width:130px;height:130px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.18);display:none}
#stick i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(255,255,255,.45)}
.editing .tbtn{outline:2px dashed var(--acc)}
#fps{position:fixed;right:6px;bottom:4px;font:11px monospace;opacity:.5;z-index:30}
#pause{z-index:55}
#hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:6px 12px;border-radius:4px;font-size:13px}
.msnTag{display:inline-block;background:var(--acc);color:#000;font-weight:800;padding:2px 8px;border-radius:2px;margin-bottom:6px;font-size:12px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading"><h1 class="font-title">Обратная сторона <span>города</span></h1><div class="bar"><i id="lbar"></i></div><p id="ltxt">Загрузка…</p></div>
<div id="rotate" class="need">↻<br>Поверните устройство горизонтально</div>
<div id="letter"></div><div id="fade"></div><div id="bubbles"></div>
<div id="hud" class="hidden">
  <div id="notify"></div>
  <div id="topR"><div id="money">$0</div><div id="wanted"><b>★</b><b>★</b><b>★</b><b>★</b><b>★</b></div><div id="weap"></div><div id="clock"></div></div>
  <div id="bars"><div><i id="hpB"></i></div><div><i id="arB"></i></div></div>
  <div id="mmWrap"><canvas id="mm" width="256" height="256"></canvas></div>
  <div id="objective"></div><div id="subtitle" class="hidden"></div>
  <div id="speedo" class="hidden"><div class="v">0</div><div class="u">КМ/Ч</div><div class="hp"><i></i></div></div>
  <div id="cross" class="hidden"></div><div id="prompt" class="hidden"></div><div id="banner" class="hidden"><div class="t"></div><div class="s"></div></div>
  <div id="hint" class="hidden"></div>
</div>
<div id="choice" class="hidden"></div>
<button id="skip" class="btn small hidden">Пропустить ▸</button>
<div id="touch" class="hidden"><div id="stick"><i></i></div></div>
<div id="mapScreen" class="hidden"><canvas id="mapC"></canvas><div id="mapUI"></div><button id="mapClose" class="btn small">✕ Закрыть (M)</button></div>
<div id="menu" class="hidden"><div class="col">
  <h1 class="font-title">Обратная сторона<em>города</em></h1>
  <div class="sub">Алекс Морган вернулся. Город — нет.</div>
  <button class="btn" id="bCont">Продолжить</button>
  <button class="btn" id="bNew">Новая игра</button>
  <button class="btn" id="bSet">Настройки</button>
  <button class="btn" id="bCtl">Управление</button>
  <button class="btn" id="bAbout">Об игре</button>
</div></div>
<div id="settings" class="panel hidden"></div>
<div id="controls" class="panel hidden"></div>
<div id="about" class="panel hidden"></div>
<div id="pause" class="panel hidden"></div>
<div id="shop" class="panel hidden"></div>
<div id="fps"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
