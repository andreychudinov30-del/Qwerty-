<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d10">
<title>FLY FIGHT</title>
<style>:root { --acc: #ffb23e; --acc2: #4fd2ff; --bg: rgba(10,14,20,0.72); --line: rgba(255,255,255,0.12); --txt: #e9eef3; --dim: #8e9aa6; --red: #ff5a4a; --green: #6dff8a; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #07090c; color: var(--txt); font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
.screen { position: absolute; inset: 0; display: none; }
.screen.on { display: block; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
/* loading */
#loading { background: radial-gradient(ellipse at 50% 30%, #1b2a3c 0%, #07090c 70%); z-index: 50; }
#loading .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); text-align: center; width: min(560px, 86vw); }
.logo { font-weight: 900; letter-spacing: 0.12em; font-size: clamp(34px, 7vw, 76px); font-style: italic; background: linear-gradient(180deg,#fff 0%,#ffd48a 45%,#ff8a1e 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 18px rgba(255,140,30,0.35)); line-height: 1; }
.logo small { display: block; font-size: 0.24em; letter-spacing: 0.5em; color: var(--dim); -webkit-text-fill-color: var(--dim); font-style: normal; margin-top: 8px; font-weight: 600; }
.bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin: 28px 0 10px; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--acc), #ff6a1e); transition: width .2s; }
#loading .st { color: var(--dim); font-size: 14px; }
#loading .tip { margin-top: 26px; font-size: 13px; color: #b9c4cf; opacity: .8; min-height: 2.6em; }
/* menu */
#menu .left { position: absolute; left: max(22px, env(safe-area-inset-left)); top: 0; bottom: 0; width: min(330px, 38vw); display: flex; flex-direction: column; justify-content: center; gap: 6px; background: linear-gradient(90deg, rgba(5,8,12,0.85) 0%, rgba(5,8,12,0.4) 80%, rgba(5,8,12,0) 100%); padding-right: 30px; }
#menu .logo { font-size: clamp(28px, 4.6vw, 54px); margin-bottom: 14px; }
.mbtn { display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 16px; font-size: clamp(14px, 1.7vw, 18px); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border-left: 3px solid transparent; background: linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0)); transition: all .15s; border-radius: 2px; }
.mbtn:hover, .mbtn:active { border-left-color: var(--acc); background: linear-gradient(90deg, rgba(255,178,62,0.25), rgba(255,178,62,0)); padding-left: 22px; }
.mbtn.primary { font-size: clamp(17px, 2.2vw, 24px); color: #fff; border-left-color: var(--acc); background: linear-gradient(90deg, rgba(255,140,30,0.45), rgba(255,140,30,0)); }
.mbtn .ic { width: 22px; text-align: center; opacity: .9; }
.topbar { position: absolute; right: max(18px, env(safe-area-inset-right)); top: 14px; display: flex; gap: 10px; align-items: center; }
.chip { background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 7px 14px; font-weight: 700; font-size: 15px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.chip .c { color: var(--acc); }
.acinfo { position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: 16px; width: min(340px, 40vw); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.acinfo h2 { margin: 0; font-size: clamp(20px, 2.6vw, 30px); font-weight: 900; font-style: italic; }
.acinfo .role { color: var(--acc); font-size: 13px; font-weight: 600; margin: 2px 0 10px; }
.stat { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); margin: 4px 0; }
.stat .b { height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
.stat .b i { display: block; height: 100%; background: linear-gradient(90deg, var(--acc2), #9be8ff); }
.hint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); font-size: 12px; color: var(--dim); opacity: .8; pointer-events: none; }
/* panels */
.panel { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5,8,12,0.92) 0%, rgba(5,8,12,0.75) 55%, rgba(5,8,12,0.2) 100%); padding: max(16px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) 16px max(22px, env(safe-area-inset-left)); display: flex; flex-direction: column; }
.panel.full { background: rgba(5,8,12,0.9); }
.phead { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.phead h1 { margin: 0; font-size: clamp(20px, 3vw, 32px); font-weight: 900; font-style: italic; letter-spacing: .04em; }
.back { padding: 8px 14px; border: 1px solid var(--line); border-radius: 6px; font-weight: 700; background: rgba(255,255,255,0.05); }
.back:hover { border-color: var(--acc); }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; min-height: 0; padding-right: 6px; touch-action: pan-y; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); background: rgba(255,255,255,0.04); border-radius: 8px; padding: 10px 12px; text-align: left; position: relative; transition: all .15s; }
.card:hover { border-color: rgba(255,178,62,0.6); }
.card.sel { border-color: var(--acc); background: rgba(255,178,62,0.12); box-shadow: 0 0 0 1px var(--acc) inset; }
.card.locked { opacity: .62; }
.card h3 { margin: 0 0 2px; font-size: 17px; font-weight: 800; }
.card .sub { font-size: 12px; color: var(--dim); }
.card .price { margin-top: 6px; font-weight: 800; color: var(--acc); font-size: 14px; }
.card .own { margin-top: 6px; font-weight: 700; color: var(--green); font-size: 13px; }
.flag { position: absolute; right: 10px; top: 10px; font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 3px; background: rgba(255,255,255,0.1); }
.flag.ru { color: #ff7a7a; } .flag.us { color: #7ab8ff; } .flag.cn { color: #ffd34d; }
.split { display: flex; gap: 16px; flex: 1; min-height: 0; }
.split .l { width: min(460px, 52vw); display: flex; flex-direction: column; min-height: 0; }
.split .r { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; }
.btn { padding: 11px 20px; border-radius: 6px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; background: linear-gradient(180deg, #ffbf55, #f08a18); color: #1a1006; box-shadow: 0 4px 16px rgba(255,140,30,0.3); }
.btn.alt { background: rgba(255,255,255,0.08); color: var(--txt); box-shadow: none; border: 1px solid var(--line); }
.btn:disabled { opacity: .4; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.tab { padding: 7px 14px; border-radius: 16px; border: 1px solid var(--line); font-weight: 700; font-size: 13px; }
.tab.on { background: var(--acc); color: #1a1006; border-color: var(--acc); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.sw { border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 12px; font-weight: 700; text-align: left; background: rgba(255,255,255,0.04); }
.sw .s { height: 26px; border-radius: 4px; margin-bottom: 6px; }
.sw.sel { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc) inset; }
.sw .p { color: var(--acc); font-size: 11px; }
.mission { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; }
.mission .n { font-size: 26px; font-weight: 900; font-style: italic; color: var(--acc); text-align: center; }
.tag { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 10px; background: rgba(255,255,255,0.08); margin: 4px 4px 0 0; color: #c9d3dc; }
.brief { max-width: 640px; }
.brief p { color: #c9d3dc; line-height: 1.5; }
.row { display: flex; gap: 10px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
.row label { min-width: 170px; color: var(--dim); font-size: 14px; }
.opt { padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line); font-size: 13px; font-weight: 700; background: rgba(255,255,255,0.04); }
.opt.on { background: var(--acc2); color: #04202a; border-color: var(--acc2); }
input[type=range] { width: min(260px, 40vw); accent-color: var(--acc); }
.statgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.sbox { background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.sbox b { display: block; font-size: 22px; font-weight: 900; }
.sbox span { font-size: 12px; color: var(--dim); }
.contract { display: grid; grid-template-columns: 1fr 120px auto; gap: 12px; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; background: rgba(255,255,255,0.03); }
.contract .b { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; } .contract .b i { display: block; height: 100%; background: var(--green); }
/* in-game */
#game { pointer-events: none; }
#hud { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#blackout { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 20%, rgba(0,0,0,0.95) 75%); }
#dmg { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(255,0,0,0) 40%, rgba(200,0,0,0.6) 100%); transition: opacity .1s; }
#pausebtn { position: absolute; left: 50%; transform: translateX(-50%); bottom: 8px; pointer-events: auto; width: 44px; height: 34px; border-radius: 6px; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.2); font-weight: 900; }
#fps { position: absolute; left: 8px; bottom: 6px; font-size: 11px; color: #9dffb8; font-family: monospace; }
#touch { position: absolute; inset: 0; pointer-events: auto; display: none; }
#touch.on { display: block; }
.stick-base { position: absolute; width: 30vmin; height: 30vmin; margin: -15vmin 0 0 -15vmin; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.05); display: none; pointer-events: none; }
.stick-knob { position: absolute; left: 50%; top: 50%; width: 12vmin; height: 12vmin; border-radius: 50%; background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.5); transform: translate(-50%,-50%); }
.stick-hint { position: absolute; left: 6vw; bottom: 8vh; color: rgba(255,255,255,0.35); font-size: 12px; pointer-events: none; }
.tb { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 12px; letter-spacing: .04em; color: #fff; background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.35); text-align: center; line-height: 1.1; }
.tb.on { background: rgba(255,178,62,0.5); border-color: var(--acc); }
.tb.gun { width: 20vmin; height: 20vmin; right: calc(max(2vw, env(safe-area-inset-right)) + 13vmin); bottom: 6vh; font-size: 14px; border-color: rgba(255,120,90,0.75); }
.tb.mis { width: 15vmin; height: 15vmin; right: calc(max(2vw, env(safe-area-inset-right)) + 36vmin); bottom: 5vh; border-color: rgba(255,200,90,0.75); }
.tb.flr { width: 12vmin; height: 12vmin; right: calc(max(2vw, env(safe-area-inset-right)) + 14vmin); bottom: calc(6vh + 23vmin); }
.tb.tgt { width: 12vmin; height: 12vmin; right: calc(max(2vw, env(safe-area-inset-right)) + 29vmin); bottom: calc(6vh + 19vmin); }
.tb.cam { width: 10vmin; height: 10vmin; right: calc(max(2vw, env(safe-area-inset-right)) + 54vmin); bottom: 5vh; font-size: 10px; }
.tb.ab { width: 10vmin; height: 10vmin; right: calc(max(2vw, env(safe-area-inset-right)) + 13vmin); bottom: calc(6vh + 37vmin); font-size: 10px; }
.tb.brake { width: 10vmin; height: 10vmin; right: calc(max(2vw, env(safe-area-inset-right)) + 26vmin); bottom: calc(6vh + 33vmin); font-size: 10px; }
.thr { position: absolute; right: max(2vw, env(safe-area-inset-right)); bottom: 6vh; width: 9vmin; height: 42vmin; border-radius: 8px; border: 2px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.25); overflow: hidden; }
.thr-fill { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(0deg, rgba(79,210,255,0.5), rgba(255,140,30,0.7)); }
.thr span { position: absolute; left: 0; right: 0; top: 4px; text-align: center; font-size: 10px; font-weight: 800; color: rgba(255,255,255,0.7); }
/* overlays */
.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(4,6,10,0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 20; }
.box { background: rgba(14,18,26,0.95); border: 1px solid var(--line); border-radius: 12px; padding: 22px 26px; min-width: min(420px, 90vw); max-width: 92vw; max-height: 92vh; overflow: auto; text-align: center; }
.box h1 { margin: 0 0 6px; font-size: clamp(26px, 5vw, 44px); font-weight: 900; font-style: italic; }
.box .btns { justify-content: center; }
.res { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
#rotate { position: fixed; inset: 0; z-index: 100; background: #07090c; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; text-align: center; padding: 20px; }
#rotate .ph { width: 60px; height: 100px; border: 4px solid #fff; border-radius: 12px; animation: rot 2s infinite ease-in-out; }
@keyframes rot { 0%,30% { transform: rotate(0) } 60%,100% { transform: rotate(-90deg) } }
@media (orientation: portrait) and (max-width: 900px) { #rotate.need { display: flex; } }
@media (max-height: 480px) { .hint { display: none; } .acinfo { width: min(300px, 40vw); } .acinfo h2 { font-size: 20px; } .split .r { overflow-y: auto; justify-content: flex-start; } .split .r .acinfo { font-size: 12px; } .stat { grid-template-columns: 80px 1fr; } .panel { padding-top: 8px; } .phead { margin-bottom: 6px; } .mbtn { padding: 6px 14px; } #menu .logo { margin-bottom: 6px; } .acinfo { padding: 10px 12px; } .stat { margin: 2px 0; } .acinfo .role { margin-bottom: 4px; } }
</style>
